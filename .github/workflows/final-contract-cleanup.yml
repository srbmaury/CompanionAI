name: Final contract cleanup

on:
  push:
    branches: [hiring-organizations]
    paths:
      - .github/workflows/final-contract-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align E2E contracts and add focused security coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          happy = Path('server/src/test/e2e/happyFlows.test.js')
          text = happy.read_text()
          replacements = [
              ('title: "Backend candidate screen", company: "Acme", jobRole: "Backend Engineer",', 'title: "Backend candidate screen", jobRole: "Backend Engineer",'),
              ('await agent.post(`/api/assessments/public/${shareToken}/start`).set("origin", origin).set("referer", `${origin}/`).send({ name: "Overwrite", email: "candidate@example.com" }).expect(409);', 'await agent.post(`/api/assessments/public/${shareToken}/start`).set("origin", origin).set("referer", `${origin}/`).send({ name: "Overwrite", email: "candidate@example.com", privacyConsent: true, integrityConsent: true }).expect(409);'),
              ('await agent.post(`/api/assessments/public/${shareToken}/start`).set("origin", origin).set("referer", `${origin}/`).send({ name: "Late Candidate", email: "late@example.com" }).expect(404);', 'await agent.post(`/api/assessments/public/${shareToken}/start`).set("origin", origin).set("referer", `${origin}/`).send({ name: "Late Candidate", email: "late@example.com", privacyConsent: true, integrityConsent: true }).expect(404);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'happyFlows expected text missing: {old}')
              text = text.replace(old, new, 1)

          consent_anchor = '        const startedAttempt = await agent.post(`/api/assessments/public/${shareToken}/start`).set("origin", origin).set("referer", `${origin}/`).send({ name: "Candidate One", email: "candidate@example.com", privacyConsent: true, integrityConsent: true }).expect(201);\n'
          if consent_anchor not in text:
              raise SystemExit('candidate start anchor missing')
          consent_checks = '''        await agent.post(`/api/assessments/public/${shareToken}/start`).set("origin", origin).set("referer", `${origin}/`).send({ name: "No Consent", email: "no-consent@example.com" }).expect(400);\n        await agent.post(`/api/assessments/public/${shareToken}/start`).set("origin", origin).set("referer", `${origin}/`).send({ name: "No Integrity Consent", email: "no-integrity@example.com", privacyConsent: true }).expect(400);\n'''
          text = text.replace(consent_anchor, consent_checks + consent_anchor, 1)
          happy.write_text(text)

          org = Path('server/src/test/e2e/organizationAccess.test.js')
          text = org.read_text()
          old_import = 'import OrganizationMembership from "../../models/OrganizationMembership.js";\n'
          if old_import not in text:
              raise SystemExit('organization membership import missing')
          text = text.replace(old_import, old_import + 'import Organization from "../../models/Organization.js";\n', 1)

          transfer_anchor = '        expect(newOwnerMembership.role).toBe("owner");\n'
          if transfer_anchor not in text:
              raise SystemExit('transfer assertion anchor missing')
          transfer_assertion = '''        const organizationAfterTransfer = await Organization.findById(organizationId).lean();\n        expect(String(organizationAfterTransfer.createdBy)).toBe(String(owner._id));\n'''
          text = text.replace(transfer_anchor, transfer_anchor + transfer_assertion, 1)

          invite_anchor = '        expect(created.body.createdBy).toBe(String(owner._id));\n'
          if invite_anchor not in text:
              raise SystemExit('created assessment anchor missing')
          invite_checks = '''\n        const inviteOnlyAssessment = await writeHeaders(agent.post("/api/assessments"), ownerAuth)\n            .send({ ...assessmentInput, title: "Invite-only backend screen", status: "active", inviteOnly: true })\n            .expect(201);\n        const inviteResult = await writeHeaders(\n            agent.post(`/api/assessments/${inviteOnlyAssessment.body._id}/invitations`),\n            ownerAuth,\n        ).send({ candidates: [{ email: "candidate-invite@example.com", name: "Invited Candidate" }] }).expect(200);\n        const invitation = inviteResult.body.invitations[0];\n        await agent.get(`/api/assessments/public/${inviteOnlyAssessment.body.shareToken}`).expect(403);\n        await agent.get(`/api/assessments/public/${inviteOnlyAssessment.body.shareToken}?invite=${invitation._id}`).expect(200);\n        await writeHeaders(agent.post(`/api/assessments/public/${inviteOnlyAssessment.body.shareToken}/start`), {})\n            .send({ name: "Invited Candidate", email: "candidate-invite@example.com", privacyConsent: true })\n            .expect(403);\n        await writeHeaders(agent.post(`/api/assessments/public/${inviteOnlyAssessment.body.shareToken}/start`), {})\n            .send({ name: "Wrong Candidate", email: "wrong@example.com", privacyConsent: true, invitationId: invitation._id })\n            .expect(403);\n        await writeHeaders(agent.post(`/api/assessments/public/${inviteOnlyAssessment.body.shareToken}/start`), {})\n            .send({ name: "Invited Candidate", email: "candidate-invite@example.com", privacyConsent: true, invitationId: invitation._id })\n            .expect(201);\n'''
          text = text.replace(invite_anchor, invite_anchor + invite_checks, 1)
          org.write_text(text)
          PY
      - name: Commit contract cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/test/e2e/happyFlows.test.js server/src/test/e2e/organizationAccess.test.js
          git diff --cached --check
          git commit -m "Cover candidate consent and invite-only contracts"
          git push
