name: Apply organization backend refactor

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend refactor
        run: python .github/scripts/apply_organization_backend.py
      - name: Commit backend refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "Scope hiring assessments to organizations"
          git push origin HEAD:hiring-organizations
