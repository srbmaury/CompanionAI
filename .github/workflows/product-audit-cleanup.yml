name: Product audit cleanup

on:
  push:
    branches: [hiring-organizations]
    paths:
      - .github/workflows/product-audit-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align browser tests and product documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          e2e = Path('client/e2e/productJourneys.spec.js')
          text = e2e.read_text()
          old = '''    await page.goto("/assessments");
    await expect(page.getByRole("heading", { name: "Hiring overview" })).toBeVisible();
    await expect(page.getByRole("button", { name: "New assessment" })).toHaveCount(0);

    if ((page.viewportSize()?.width || 0) >= 900) {
        await page.getByRole("link", { name: "Team" }).click();
    } else {
        await page.getByRole("button", { name: "Open navigation" }).click();
        await page.getByRole("menuitem", { name: "Team & organization" }).click();
    }
    await expect(page).toHaveURL(/\\/hiring\\/team$/);
    await expect(page.getByRole("heading", { name: "Team & organization" })).toBeVisible();
    await expect(page.getByRole("heading", { name: "Add existing CompanionAI user" })).toHaveCount(0);
'''
          new = '''    await page.goto("/assessments");
    await expect(page.getByRole("heading", { name: "Candidate pipeline" })).toBeVisible();
    await expect(page.getByRole("heading", { name: "Hiring overview" })).toHaveCount(0);
    await expect(page.getByRole("button", { name: "New assessment" })).toHaveCount(0);

    if ((page.viewportSize()?.width || 0) >= 900) {
        await expect(page.getByRole("link", { name: "Team & billing" })).toHaveCount(0);
    } else {
        await page.getByRole("button", { name: "Open navigation" }).click();
        await expect(page.getByRole("menuitem", { name: "Team & Hiring billing" })).toHaveCount(0);
        await page.keyboard.press("Escape");
    }

    await page.goto("/hiring/team");
    await expect(page).toHaveURL(/\\/assessments#candidate-pipeline$/);
    await expect(page.getByRole("heading", { name: "Organization settings" })).toHaveCount(0);
'''
          if old not in text:
              raise SystemExit('Reviewer browser assertion block not found')
          text = text.replace(old, new, 1)
          old_price = '["/pricing", "Choose the capacity you need"],'
          if old_price not in text:
              raise SystemExit('Legacy Practice pricing heading not found')
          text = text.replace(old_price, '["/pricing", "Choose your Practice plan"],', 1)
          e2e.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          replacements = {
              '- Plan limits: Free includes 3 interviews, 3 resume reviews, and 2 assessments monthly; Pro raises those to 100/100/50; Scale raises them to 1000/1000/500 by default. Public attempt actions retain Redis-backed abuse quotas on every plan.': '- Monetization: Practice is user-owned (Free: 3 interviews + 3 resume reviews/month; Pro: 100 + 100 by default). Hiring is organization-owned and meters candidate interviews rather than assessment definitions (first organization trial: 5 lifetime credits; Starter: 25/month; Growth: 100/month by default).',
              '  - Stripe requires `STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`, `STRIPE_PRO_PRICE_ID`, and `STRIPE_SCALE_PRICE_ID`': '  - Stripe requires `STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`, `STRIPE_PRACTICE_PRO_PRICE_ID`, `STRIPE_HIRING_STARTER_PRICE_ID`, and `STRIPE_HIRING_GROWTH_PRICE_ID`',
              '- Billing: `GET /api/billing/entitlements` · `POST /api/billing/checkout-session` · `POST /api/billing/portal-session` · `POST /api/billing/webhook`': '- Billing: Practice uses `/api/billing/practice/entitlements`, `/api/billing/practice/checkout-session`, and `/api/billing/practice/portal-session`; Hiring uses the corresponding `/api/billing/hiring/*` organization-scoped endpoints; Stripe webhooks remain at `/api/billing/webhook`.',
              '- `/assessments`, `/assessments/:assessmentId`, `/assessment/:shareToken`': '- `/assessments`, `/assessments/:assessmentId`, `/assessment/:shareToken`, `/hiring/team`',
              '1. Create separate recurring Stripe Prices for Pro and Scale, then set `STRIPE_PRO_PRICE_ID` and `STRIPE_SCALE_PRICE_ID`.': '1. Create a recurring Stripe Price for Practice Pro plus separate recurring Prices for Hiring Starter and Growth; set `STRIPE_PRACTICE_PRO_PRICE_ID`, `STRIPE_HIRING_STARTER_PRICE_ID`, and `STRIPE_HIRING_GROWTH_PRICE_ID`.',
          }
          for old_text, new_text in replacements.items():
              if old_text not in text:
                  raise SystemExit(f'README text not found: {old_text[:80]}')
              text = text.replace(old_text, new_text, 1)
          readme.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/e2e/productJourneys.spec.js README.md
          git diff --cached --check
          git commit -m "Align product tests and docs with current hiring model"
          git push
