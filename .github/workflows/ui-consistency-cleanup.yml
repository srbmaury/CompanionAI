name: UI consistency cleanup

on:
  push:
    branches:
      - fix/ui-consistency-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-consistency-cleanup
          fetch-depth: 0
      - name: Apply cleanup
        run: python scripts/ui_consistency_cleanup.py
      - name: Commit cleanup
        run: |
          rm scripts/ui_consistency_cleanup.py
          rm .github/workflows/ui-consistency-cleanup.yml
          git config user.name "Saurabh Maurya"
          git config user.email "srbmaury@gmail.com"
          git add -A
          git commit -m "Polish UI consistency and navigation"
          git push origin HEAD:fix/ui-consistency-cleanup
