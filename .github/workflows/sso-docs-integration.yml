name: One-shot SSO docs integration

on:
  push:
    branches: [hiring-organizations]
    paths:
      - .github/workflows/sso-docs-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hiring-organizations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync latest branch head
        run: |
          git fetch origin hiring-organizations
          git reset --hard origin/hiring-organizations
      - name: Apply guarded integration patch
        run: python .github/scripts/sso_docs_integration.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/app.js server/src/controllers/authController.js server/.env.example client/src/pages/HiringTeamPage.jsx client/src/utils/navigationHierarchy.js client/src/components/SiteFooter.jsx README.md
          git diff --cached --quiet && exit 0
          git commit -m "Integrate OIDC SSO and public docs"
          git push origin HEAD:hiring-organizations
