name: Apply adaptive interview intelligence

on:
  push:
    paths:
      - ".github/workflows/apply-adaptive-ai.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-ai-interviews
          fetch-depth: 0
      - name: Sync branch
        run: |
          git fetch origin adaptive-ai-interviews
          git reset --hard origin/adaptive-ai-interviews
      - name: Apply guarded patch
        run: python .github/scripts/apply_adaptive_ai.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server client
          git diff --cached --check
          git commit -m "Make AI interviews adaptive and role-aware"
          git push origin HEAD:adaptive-ai-interviews
