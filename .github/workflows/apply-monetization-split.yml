name: Apply monetization split

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Practice and Hiring monetization split
        run: python .github/scripts/apply-monetization-split.py
      - name: Show resulting diff
        run: git diff --stat && git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate Practice and Hiring monetization"
          git push origin HEAD:hiring-organizations
