name: Patch hiring header

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_hiring_header.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/Header.jsx
          git commit -m "Add hiring team navigation and role-aware actions"
          git push origin HEAD:hiring-organizations
