name: Fix adaptive AI cleanup

on:
  push:
    paths:
      - ".github/workflows/fix-adaptive-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-ai-interviews
          fetch-depth: 0
      - name: Sync latest branch
        run: |
          git fetch origin adaptive-ai-interviews
          git reset --hard origin/adaptive-ai-interviews
      - name: Apply focused cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          hook = Path('client/src/hooks/useConversational.js')
          hook_text = hook.read_text()
          old = '    setSelectedRound,\n'
          if hook_text.count(old) != 1:
              raise SystemExit('Expected unused setSelectedRound exactly once')
          hook.write_text(hook_text.replace(old, ''))

          planner = Path('server/src/utils/interviewRounds.js')
          planner_text = planner.read_text()
          pattern = r'export const sanitizeRoundPlan = \(rounds, fallbackRounds = \[\]\) => \{.*?\n\};\n\n(?=export const suggestRounds)'
          replacement = '''export const sanitizeRoundPlan = (rounds, fallbackRounds = []) => {
              const normalize = (round) => ({
                  ...round,
                  roundName: clean(round?.roundName, 60),
                  description: clean(round?.description, 260),
                  deliveryMode: round?.deliveryMode === "online-assessment" ? "online-assessment" : "conversational",
                  questionLimit: clamp(round?.questionLimit, 2, 10),
                  skills: Array.isArray(round?.skills) ? round.skills.map((skill) => clean(skill, 60)).filter(Boolean).slice(0, 6) : [],
                  rationale: clean(round?.rationale, 240),
                  recommended: round?.recommended !== false,
              });

              const uniqueValid = (items, max) => {
                  const result = [];
                  const seen = new Set();
                  for (const candidate of Array.isArray(items) ? items : []) {
                      if (!candidate || typeof candidate.roundName !== "string" || typeof candidate.description !== "string") continue;
                      const round = normalize(candidate);
                      const key = round.roundName.toLowerCase();
                      if (!round.roundName || !round.description || seen.has(key)) continue;
                      seen.add(key);
                      result.push(round);
                      if (result.length >= max) break;
                  }
                  return result;
              };

              const aiPlan = uniqueValid(rounds, 5);
              const result = aiPlan.length >= 2 ? aiPlan : uniqueValid(fallbackRounds, 4);
              if (!result.some((round) => round.recommended)) {
                  result.slice(0, Math.min(2, result.length)).forEach((round) => { round.recommended = true; });
              }
              return result;
          };

          '''
          updated, count = re.subn(pattern, lambda _: replacement, planner_text, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected sanitizer block once, found {count}')
          planner.write_text(updated)

          test = Path('server/src/test/unit/adaptiveInterviewPlanning.test.js')
          test_text = test.read_text()
          old_test = '''        const rounds = sanitizeRoundPlan([{
                      roundName: "API Design",
                      description: "Probe API and data trade-offs.",
                      deliveryMode: "conversational",
                      questionLimit: 99,
                      skills: ["APIs", "data modeling"],
                      rationale: "Core role responsibility",
                      recommended: false,
                  }], fallback);
                  expect(rounds.length).toBeGreaterThanOrEqual(2);
                  expect(rounds[0]).toMatchObject({ roundName: "API Design", questionLimit: 10, recommended: false });
                  expect(rounds.some((round) => round.recommended)).toBe(true);'''
          new_test = '''        const rounds = sanitizeRoundPlan([
                      {
                          roundName: "API Design",
                          description: "Probe API and data trade-offs.",
                          deliveryMode: "conversational",
                          questionLimit: 99,
                          skills: ["APIs", "data modeling"],
                          rationale: "Core role responsibility",
                          recommended: false,
                      },
                      {
                          roundName: "Failure Modes",
                          description: "Probe reliability decisions and production failure handling.",
                          deliveryMode: "conversational",
                          questionLimit: 4,
                          skills: ["reliability"],
                          rationale: "Important production responsibility",
                          recommended: true,
                      },
                  ], fallback);
                  expect(rounds).toHaveLength(2);
                  expect(rounds[0]).toMatchObject({ roundName: "API Design", questionLimit: 10, recommended: false });
                  expect(rounds[1]).toMatchObject({ roundName: "Failure Modes", recommended: true });'''
          if test_text.count(old_test) != 1:
              raise SystemExit('Expected planner sanitizer test exactly once')
          test.write_text(test_text.replace(old_test, new_test))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/hooks/useConversational.js server/src/utils/interviewRounds.js server/src/test/unit/adaptiveInterviewPlanning.test.js
          git diff --cached --check
          git commit -m "Tighten adaptive interview planning"
          git push origin HEAD:adaptive-ai-interviews
