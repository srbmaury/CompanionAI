name: Anti-pattern cleanup

on:
  push:
    branches: [hiring-organizations]
    paths:
      - .github/workflows/anti-pattern-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded domain and UI cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old[:140]!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          patch('server/src/controllers/assessmentController.js', [
              ('import CandidateAttempt from "../models/CandidateAttempt.js";\n', 'import CandidateAttempt from "../models/CandidateAttempt.js";\nimport Organization from "../models/Organization.js";\n'),
              ('const publicAssessment = (assessment) => ({\n    title: assessment.title,\n    company: assessment.company,\n', 'const publicAssessment = (assessment, organizationName = "") => ({\n    title: assessment.title,\n    organizationName,\n'),
              ('const { title, company = "", jobRole, jobDescription, followUpsEnabled = true, inviteOnly = false, candidateInstructions = "", contactEmail = "", durationMinutes = 30, opensAt, expiresAt, timezone = "UTC", rounds, integrity, rubric = [], templateName = "", status = "draft" } = req.body;', 'const { title, jobRole, jobDescription, followUpsEnabled = true, inviteOnly = false, candidateInstructions = "", contactEmail = "", durationMinutes = 30, opensAt, expiresAt, timezone = "UTC", rounds, integrity, rubric = [], templateName = "", status = "draft" } = req.body;'),
              ('                    company, jobRole, jobDescription, resumeText: "", roundName: input.name,', '                    company: req.organization?.name || "", jobRole, jobDescription, resumeText: "", roundName: input.name,'),
              ('            organization: req.organizationId, createdBy: req.user._id, title, company, jobRole, jobDescription, followUpsEnabled, inviteOnly,', '            organization: req.organizationId, createdBy: req.user._id, title, jobRole, jobDescription, followUpsEnabled, inviteOnly,'),
              ('const { company = "", jobRole, jobDescription, roundName, roundDescription = "", prompt = "", count = 5, existingQuestions = [] } = req.body;\n        const questions = await generateQuestionsForRound({\n            company, jobRole, jobDescription, resumeText: "", roundName,\n            roundDescription: [roundDescription, prompt ? `Interviewer generation request: ${prompt}` : ""].filter(Boolean).join("\\n"),\n            deliveryMode: "online-assessment", count, excludeTexts: existingQuestions,\n', 'const { jobRole, jobDescription, roundName, roundDescription = "", deliveryMode = "conversational", prompt = "", count = 5, existingQuestions = [] } = req.body;\n        const questions = await generateQuestionsForRound({\n            company: req.organization?.name || "", jobRole, jobDescription, resumeText: "", roundName,\n            roundDescription: [roundDescription, prompt ? `Interviewer generation request: ${prompt}` : ""].filter(Boolean).join("\\n"),\n            deliveryMode, count, excludeTexts: existingQuestions,\n'),
              ('.select("title company jobRole status opensAt expiresAt createdAt invitations.status")', '.select("title jobRole status opensAt expiresAt createdAt invitations.status")'),
              ('const editable = ["title", "company", "jobRole", "jobDescription", "followUpsEnabled", "inviteOnly", "candidateInstructions", "contactEmail", "durationMinutes", "opensAt", "expiresAt", "timezone", "integrity", "rubric", "templateName", "rounds"];', 'const editable = ["title", "jobRole", "jobDescription", "followUpsEnabled", "inviteOnly", "candidateInstructions", "contactEmail", "durationMinutes", "opensAt", "expiresAt", "timezone", "integrity", "rubric", "templateName", "rounds"];'),
              ('        const invitation = req.query.invite ? assessment.invitations?.id(req.query.invite) : null;\n        if (invitation && ["invited", "sent", "delivered"].includes(invitation.status)) { invitation.status = "opened"; invitation.openedAt = new Date(); await assessment.save(); }\n        observeCandidateAction("view", "success", assessment);\n        return res.json(publicAssessment(assessment));', '        const invitation = req.query.invite ? assessment.invitations?.id(req.query.invite) : null;\n        if (assessment.inviteOnly && (!invitation || invitation.status === "revoked")) {\n            return res.status(403).json({ message: "This assessment is invitation-only. Open the invitation link sent to your email." });\n        }\n        if (invitation && ["invited", "sent", "delivered"].includes(invitation.status)) { invitation.status = "opened"; invitation.openedAt = new Date(); await assessment.save(); }\n        const organization = await Organization.findById(assessment.organization).select("name").lean();\n        observeCandidateAction("view", "success", assessment);\n        return res.json(publicAssessment(assessment, organization?.name || ""));'),
              ('return res.json({ ...publicAssessment(assessment), status: assessment.status, rounds:', 'return res.json({ ...publicAssessment(assessment, req.organization?.name || ""), status: assessment.status, rounds:'),
              ('        const activeInvitation = assessment.invitations?.find((item) => item.email === candidateEmail && item.status !== "revoked");\n        if (assessment.inviteOnly && !activeInvitation) return res.status(403).json({ message: "This assessment is invitation-only. Use the email address that was invited." });', '        if (assessment.integrity?.enabled && req.body.integrityConsent !== true) return res.status(400).json({ message: "Consent to the configured integrity signals is required before starting this assessment." });\n        const activeInvitation = req.body.invitationId ? assessment.invitations?.id(req.body.invitationId) : null;\n        const validInvitation = activeInvitation && activeInvitation.status !== "revoked" && activeInvitation.email === candidateEmail ? activeInvitation : null;\n        if (assessment.inviteOnly && !validInvitation) return res.status(403).json({ message: "This assessment is invitation-only. Open the invitation link sent to your email and use that invited email address." });'),
              ('        attempt.candidateName = req.body.name.trim(); attempt.accessTokenHash = tokenHash(rawToken); attempt.rounds = rounds; attempt.status = "started"; attempt.startedAt = new Date();\n        if (assessment.integrity?.enabled && req.body.integrityConsent) attempt.integrityConsentAt = new Date();\n        const invitation = activeInvitation;', '        attempt.candidateName = req.body.name.trim(); attempt.accessTokenHash = tokenHash(rawToken); attempt.rounds = rounds; attempt.status = "started"; attempt.startedAt = new Date(); attempt.privacyConsentAt = new Date();\n        if (assessment.integrity?.enabled && req.body.integrityConsent) attempt.integrityConsentAt = new Date();\n        const invitation = validInvitation;'),
          ])

          patch('client/src/pages/AssessmentsPage.jsx', [
              ('const initialForm = { title: "", company: "", jobRole: "",', 'const initialForm = { title: "", jobRole: "",'),
              ('const suggestedAssessmentTitle = (role, company) => role ? `${role}${company ? ` at ${company}` : ""}` : "";', 'const suggestedAssessmentTitle = (role) => role ? `${role} Assessment` : "";'),
              ('    const setRoleContext = (key, value) => setForm((current) => {\n        const next = { ...current, [key]: value };\n        if (!titleCustomized) next.title = suggestedAssessmentTitle(next.jobRole, next.company);\n        return next;\n    });', '    const setJobRole = (value) => setForm((current) => ({ ...current, jobRole: value, ...(!titleCustomized ? { title: suggestedAssessmentTitle(value) } : {}) }));'),
              ('{ company: form.company, jobRole: form.jobRole, jobDescription: form.jobDescription, roundName: round.name, roundDescription: round.description, prompt: round.aiPrompt, count: remaining, existingQuestions: existing.map((question) => question.text) }', '{ jobRole: form.jobRole, jobDescription: form.jobDescription, roundName: round.name, roundDescription: round.description, deliveryMode: round.deliveryMode, prompt: round.aiPrompt, count: remaining, existingQuestions: existing.map((question) => question.text) }'),
              ('<JobPostImporter onImport={({ company, jobRole, jobDescription }) => { setTitleCustomized(false); setForm((current) => ({ ...current, company: company || current.company, jobRole, jobDescription, title: suggestedAssessmentTitle(jobRole, company || current.company) })); }} />', '<JobPostImporter onImport={({ jobRole, jobDescription }) => { setTitleCustomized(false); setForm((current) => ({ ...current, jobRole, jobDescription, title: suggestedAssessmentTitle(jobRole) })); }} />'),
              ('<Stack direction={{ xs: "column", md: "row" }} spacing={2}><TextField required fullWidth label="Job role" value={form.jobRole} onChange={(e) => setRoleContext("jobRole", e.target.value)} /><TextField fullWidth label="Company (optional)" value={form.company} onChange={(e) => setRoleContext("company", e.target.value)} /></Stack>', '<Paper variant="outlined" sx={{ px: 2, py: 1.5 }}><Typography variant="caption" color="text.secondary">Creating for</Typography><Typography fontWeight={800}>{activeOrganization?.name}</Typography></Paper><TextField required fullWidth label="Job role" value={form.jobRole} onChange={(e) => setJobRole(e.target.value)} />'),
              ('helperText="Generated from the role and company. Candidates will see this name."', 'helperText="Generated from the role. Candidates will see this name."'),
          ])

          patch('client/src/pages/CandidateAssessmentPage.jsx', [
              ('    const { shareToken } = useParams(); const storageKey = `assessment-attempt:${shareToken}`;', '    const { shareToken } = useParams(); const storageKey = `assessment-attempt:${shareToken}`;\n    const invitationId = useMemo(() => new URLSearchParams(window.location.search).get("invite") || "", []);'),
              ('const invite = new URLSearchParams(window.location.search).get("invite"); const { data } = await api.get(`/assessments/public/${shareToken}`, { params: invite ? { invite } : undefined });', 'const { data } = await api.get(`/assessments/public/${shareToken}`, { params: invitationId ? { invite: invitationId } : undefined });'),
              (')(); }, [shareToken, storageKey]);', ')(); }, [invitationId, shareToken, storageKey]);'),
              ('api.post(`/assessments/public/${shareToken}/start`, { ...identity, integrityConsent }, { skipAuthRedirect: true })', 'api.post(`/assessments/public/${shareToken}/start`, { ...identity, privacyConsent: consent, integrityConsent, ...(invitationId ? { invitationId } : {}) }, { skipAuthRedirect: true })'),
              ('<Typography variant="overline" color="primary" fontWeight={800}>{assessment.company || "Candidate assessment"}</Typography>', '<Typography variant="overline" color="primary" fontWeight={800}>{assessment.organizationName || "Candidate assessment"}</Typography>'),
          ])

          patch('client/src/pages/AssessmentReportPage.jsx', [
              ('const { currentRole } = useContext(OrganizationContext); const canManageAssessments = hiringPermissionsFor(currentRole).canManageAssessments;', 'const { currentRole } = useContext(OrganizationContext); const { canManageAssessments, canViewAssessments, canExportCandidateData } = hiringPermissionsFor(currentRole);'),
              ('{assessment.jobRole}{assessment.company ? ` · ${assessment.company}` : ""}', '{assessment.jobRole}'),
              ('<Button component={RouterLink} to={`/assessments/${assessmentId}/preview`}>Preview candidate experience</Button>', '{canViewAssessments && <Button component={RouterLink} to={`/assessments/${assessmentId}/preview`}>Preview candidate experience</Button>}'),
              ('<Button disabled={!attempts.length} onClick={exportCsv}>Export CSV</Button>', '{canExportCandidateData && <Button disabled={!attempts.length} onClick={exportCsv}>Export CSV</Button>}'),
          ])

          patch('client/src/pages/HiringTeamPage.jsx', [
              ('import { hiringHomeForRole, hiringPermissionsFor } from "../utils/hiringPermissions";\n\nconst ROLE_LABELS = {\n    owner: "Owner",\n    admin: "Admin",\n    recruiter: "Recruiter",\n    hiring_manager: "Hiring manager",\n    reviewer: "Reviewer",\n};\n\nconst ASSIGNABLE_ROLES = ["admin", "recruiter", "hiring_manager", "reviewer"];', 'import { assignableHiringRolesFor, canManageHiringMember, HIRING_ROLE_LABELS, hiringHomeForRole, hiringPermissionsFor } from "../utils/hiringPermissions";'),
              ('    const { canManageOrganization } = hiringPermissionsFor(currentRole);\n    const canManage = canManageOrganization;', '    const { canManageOrganization } = hiringPermissionsFor(currentRole);\n    const assignableRoles = assignableHiringRolesFor(currentRole);'),
              ('label={ROLE_LABELS[currentRole] || currentRole}', 'label={HIRING_ROLE_LABELS[currentRole] || currentRole}'),
              ('const isOwner = membership.role === "owner";', 'const isOwner = membership.role === "owner";\n                            const canManageThisMember = canManageHiringMember(currentRole, membership.role);'),
              ('{canManage && !isOwner ? (', '{canManageThisMember ? ('),
              ('{ASSIGNABLE_ROLES.map((item) => <MenuItem key={item} value={item}>{ROLE_LABELS[item]}</MenuItem>)}', '{assignableRoles.map((item) => <MenuItem key={item} value={item}>{HIRING_ROLE_LABELS[item]}</MenuItem>)}'),
              (') : <Chip size="small" label={ROLE_LABELS[membership.role] || membership.role} />}', ') : <Chip size="small" label={HIRING_ROLE_LABELS[membership.role] || membership.role} />}'),
              ('{canManage && !isOwner && <Button color="error" size="small" onClick={() => removeMember(membership._id)}>Remove</Button>}', '{canManageThisMember && <Button color="error" size="small" onClick={() => removeMember(membership._id)}>Remove</Button>}'),
              ('{canManage && (', '{canManageOrganization && ('),
              ('{ASSIGNABLE_ROLES.map((item) => <MenuItem key={item} value={item}>{ROLE_LABELS[item]}</MenuItem>)}', '{assignableRoles.map((item) => <MenuItem key={item} value={item}>{HIRING_ROLE_LABELS[item]}</MenuItem>)}'),
          ])

          patch('client/src/__tests__/assessmentsPage.test.jsx', [
              ('jobRole: "Engineer", company: "Acme",', 'jobRole: "Engineer",'),
              ('jobRole: "Backend Engineer", company: "Acme"', 'jobRole: "Backend Engineer"'),
              ('expect(post).toHaveBeenCalledWith("/assessments/questions/generate", expect.objectContaining({ count: 3 }))', 'expect(post).toHaveBeenCalledWith("/assessments/questions/generate", expect.objectContaining({ count: 3, deliveryMode: "online-assessment" }))'),
          ])

          patch('server/src/test/e2e/organizationAccess.test.js', [
              ('    company: "Acme",\n', ''),
              ('        const reviewerList = await agent.get("/api/assessments").set(reviewerAuth).expect(200);\n        expect(reviewerList.body.items).toHaveLength(1);\n        expect(reviewerList.body.items[0]._id).toBe(assessmentId);', '        await agent.get("/api/assessments").set(reviewerAuth).expect(403);\n        const reviewerOverview = await agent.get("/api/assessments/overview").set(reviewerAuth).expect(200);\n        expect(reviewerOverview.body.summary.assessments).toBe(1);\n        await agent.get(`/api/assessments/${assessmentId}/preview`).set(reviewerAuth).expect(403);'),
          ])

          patch('client/e2e/productJourneys.spec.js', [
              ('    await page.getByLabel("Company (optional)").fill("CompanionAI");\n', ''),
              ('company: "Acme", ', 'organizationName: "Acme", '),
              ('["/pricing", "Choose the capacity you need"],', '["/pricing", "Choose your Practice plan"],'),
              ('["/assessments", "Candidate assessments"],', '["/assessments", "Hiring overview"],'),
          ])

          # Require explicit candidate consent in real server E2E start requests.
          p = Path('server/src/test/e2e/happyFlows.test.js')
          text = p.read_text()
          text = text.replace('integrityConsent: true', 'privacyConsent: true, integrityConsent: true')
          text = text.replace('integrityConsent: false', 'privacyConsent: true, integrityConsent: false')
          p.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/controllers/assessmentController.js client/src/pages/AssessmentsPage.jsx client/src/pages/CandidateAssessmentPage.jsx client/src/pages/AssessmentReportPage.jsx client/src/pages/HiringTeamPage.jsx client/src/__tests__/assessmentsPage.test.jsx server/src/test/e2e/organizationAccess.test.js server/src/test/e2e/happyFlows.test.js client/e2e/productJourneys.spec.js
          git diff --cached --check
          git commit -m "Clean assessment and hiring domain anti-patterns"
          git push
