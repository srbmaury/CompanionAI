name: Calibration integration patch

on:
  push:
    branches: [adaptive-interview-calibration]
    paths:
      - .github/workflows/calibration-patch.yml
      - .github/scripts/calibration_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-interview-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python .github/scripts/calibration_patch.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src client/src
          git diff --cached --quiet && exit 0
          git commit -m "Add adaptive interview calibration observability"
          git push origin HEAD:adaptive-interview-calibration
