name: Patch hiring role UI

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_hiring_role_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AssessmentsPage.jsx client/src/pages/AssessmentReportPage.jsx
          git commit -m "Align hiring UI with organization roles"
          git push origin HEAD:hiring-organizations
