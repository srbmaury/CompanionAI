name: Fix public code editor auth context

on:
  push:
    branches:
      - hiring-organizations

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Make auth context optional for public code editor
        run: |
          grep -q 'const { user } = useContext(AuthContext);' client/src/components/CodeEditorField.jsx
          sed -i 's/const { user } = useContext(AuthContext);/const authContext = useContext(AuthContext);/' client/src/components/CodeEditorField.jsx
          sed -i 's/const preferredProgrammingLanguage = user?.preferredProgrammingLanguage;/const preferredProgrammingLanguage = authContext?.user?.preferredProgrammingLanguage;/' client/src/components/CodeEditorField.jsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/CodeEditorField.jsx
          git diff --cached --check
          git commit -m "Allow code editor outside auth provider"
          git push
