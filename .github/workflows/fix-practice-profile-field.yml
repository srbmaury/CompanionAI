name: Fix Practice profile field

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy plan field in profile and export
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/src/routes/authRoutes.js')
          s = p.read_text()
          old1 = 'reminderTimezone, plan, practiceSubscriptionStatus, isVerified } = req.user;'
          new1 = 'reminderTimezone, practicePlan, practiceSubscriptionStatus, isVerified } = req.user;'
          old2 = 'reminderTimezone, plan, practiceSubscriptionStatus, isVerified });'
          new2 = 'reminderTimezone, practicePlan, practiceSubscriptionStatus, isVerified });'
          old3 = 'reminderTimezone plan practiceSubscriptionStatus isVerified createdAt updatedAt'
          new3 = 'reminderTimezone practicePlan practiceSubscriptionStatus isVerified createdAt updatedAt'
          for old in (old1, old2, old3):
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
          s = s.replace(old1, new1).replace(old2, new2).replace(old3, new3)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/routes/authRoutes.js
          git commit -m "Expose Practice plan consistently in account APIs"
          git push origin HEAD:hiring-organizations
