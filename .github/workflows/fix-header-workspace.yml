name: Fix dashboard workspace inference

on:
  push:
    branches: [separate-flows]

jobs:
  patch-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Include dashboard in Practice route inference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/components/Header.jsx')
          s = p.read_text()
          old = 'const practiceRoute = ["/create-interview", "/interviews", "/resume", "/progress", "/experiences", "/saved-experiences"].some((path) => location.pathname.startsWith(path));'
          new = 'const practiceRoute = ["/dashboard", "/create-interview", "/interviews", "/resume", "/progress", "/experiences", "/saved-experiences"].some((path) => location.pathname.startsWith(path));'
          if old not in s:
              raise SystemExit('Header practice-route marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit header fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/Header.jsx
          git commit -m "Keep dashboard in Practice workspace"
          git push origin HEAD:separate-flows
