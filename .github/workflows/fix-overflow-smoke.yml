name: One-shot overflow smoke fix

on:
  push:
    branches: [hiring-organizations]
    paths:
      - .github/workflows/fix-overflow-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hiring-organizations
          fetch-depth: 0
      - name: Sync latest branch head
        run: |
          git fetch origin hiring-organizations
          git reset --hard origin/hiring-organizations
      - name: Apply guarded test patch
        run: python .github/scripts/fix_overflow_smoke.py
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/e2e/productJourneys.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "Align overflow smoke with Hiring page title"
          git push origin HEAD:hiring-organizations
