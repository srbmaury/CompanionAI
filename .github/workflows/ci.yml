name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 14
      # React Router's remaining advisory affects RSC action handling; this app
      # is a client-only BrowserRouter SPA. Critical findings still fail CI.
      - run: npm audit --omit=dev --audit-level=critical

  server:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Server unit tests
        run: npm run test:unit
      - name: Server API journeys
        run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  regenerate-server-lockfile:
    if: github.ref == 'refs/heads/separate-flows' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete and regenerate server package-lock.json
        run: |
          cd server
          rm package-lock.json
          npm install
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "Regenerate server package lock"
          git push origin HEAD:separate-flows
