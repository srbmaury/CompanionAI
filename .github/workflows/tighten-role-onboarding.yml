name: Tighten Hiring role onboarding

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten role navigation and organization access
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              occurrences = s.count(old)
              if occurrences != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {occurrences}: {old[:120]!r}')
              p.write_text(s.replace(old, new))

          # Header: preserve a first-organization setup path and make reviewer pipeline a true root.
          path = 'client/src/components/Header.jsx'
          replace(path,
              '    const currentOrganizationRole = organizationContext?.currentRole || null;\n    const {\n',
              '    const currentOrganizationRole = organizationContext?.currentRole || null;\n    const hasHiringOrganization = Boolean(organizationContext?.activeOrganizationId);\n    const {\n')
          replace(path,
              '    const switchWorkspace = (next) => { if (user?._id) setWorkspacePreference(next, user._id); setWorkspace(next); setWorkspaceAnchor(null); setProfileAnchor(null); navigate(next === "hiring" ? hiringHomeForRole(currentOrganizationRole) : "/dashboard"); };\n    const isActive = (path) => location.pathname === path || location.pathname.startsWith(`${path}/`);\n    const isRootScreen = location.pathname === "/" || location.pathname === "/dashboard" || (location.pathname === "/assessments" && !location.search && !location.hash);\n',
              '    const switchWorkspace = (next) => { if (user?._id) setWorkspacePreference(next, user._id); setWorkspace(next); setWorkspaceAnchor(null); setProfileAnchor(null); navigate(next === "hiring" ? (hasHiringOrganization ? hiringHomeForRole(currentOrganizationRole) : "/hiring/team") : "/dashboard"); };\n    const isActive = (path) => location.pathname === path || location.pathname.startsWith(`${path}/`);\n    const isHiringHome = location.pathname === "/assessments" && !location.search && (!location.hash || (currentOrganizationRole === "reviewer" && location.hash === "#candidate-pipeline"));\n    const isRootScreen = location.pathname === "/" || location.pathname === "/dashboard" || isHiringHome || (location.pathname === "/hiring/team" && !hasHiringOrganization);\n')
          replace(path,
              '    const workspaceHome = workspace === "hiring" ? hiringHomeForRole(currentOrganizationRole) : "/dashboard";\n',
              '    const workspaceHome = workspace === "hiring" ? (hasHiringOrganization ? hiringHomeForRole(currentOrganizationRole) : "/hiring/team") : "/dashboard";\n')
          replace(path,
              '                                    {canViewHiringOverview && <Button onClick={openHiringOverview} sx={{ px: 1.5, color: !location.hash ? "primary.main" : "text.secondary", bgcolor: !location.hash ? "action.selected" : "transparent", "&:hover": { bgcolor: "action.hover", color: "text.primary" } }}>Overview</Button>}\n                                    {canViewCandidatePipeline && <Button onClick={() => openHiringSection("candidate-pipeline")} sx={{ px: 1.5, color: location.hash === "#candidate-pipeline" ? "primary.main" : "text.secondary", bgcolor: location.hash === "#candidate-pipeline" ? "action.selected" : "transparent" }}>Candidate pipeline</Button>}\n                                    {canViewAssessments && <Button onClick={() => openHiringSection("assessment-list")} sx={{ px: 1.5, color: location.hash === "#assessment-list" ? "primary.main" : "text.secondary", bgcolor: location.hash === "#assessment-list" ? "action.selected" : "transparent" }}>Assessments</Button>}\n                                    {canManageOrganization && <Button component={RouterLink} to="/hiring/team" sx={navSx("/hiring/team")}>Team & billing</Button>}\n',
              '                                    {!hasHiringOrganization && <Button component={RouterLink} to="/hiring/team" sx={navSx("/hiring/team")}>Set up Hiring</Button>}\n                                    {hasHiringOrganization && canViewHiringOverview && <Button onClick={openHiringOverview} sx={{ px: 1.5, color: !location.hash ? "primary.main" : "text.secondary", bgcolor: !location.hash ? "action.selected" : "transparent", "&:hover": { bgcolor: "action.hover", color: "text.primary" } }}>Overview</Button>}\n                                    {hasHiringOrganization && canViewCandidatePipeline && <Button onClick={() => openHiringSection("candidate-pipeline")} sx={{ px: 1.5, color: location.hash === "#candidate-pipeline" ? "primary.main" : "text.secondary", bgcolor: location.hash === "#candidate-pipeline" ? "action.selected" : "transparent" }}>Candidate pipeline</Button>}\n                                    {hasHiringOrganization && canViewAssessments && <Button onClick={() => openHiringSection("assessment-list")} sx={{ px: 1.5, color: location.hash === "#assessment-list" ? "primary.main" : "text.secondary", bgcolor: location.hash === "#assessment-list" ? "action.selected" : "transparent" }}>Assessments</Button>}\n                                    {hasHiringOrganization && canManageOrganization && <Button component={RouterLink} to="/hiring/team" sx={navSx("/hiring/team")}>Team & billing</Button>}\n')
          replace(path,
              '                                <MenuItem component={RouterLink} to={workspaceHome} onClick={close}>Overview</MenuItem>\n',
              '                                {(workspace === "practice" || (hasHiringOrganization && canViewHiringOverview)) && <MenuItem component={RouterLink} to={workspaceHome} onClick={close}>Overview</MenuItem>}\n                                {workspace === "hiring" && !hasHiringOrganization && <MenuItem component={RouterLink} to="/hiring/team" onClick={close}>Set up Hiring</MenuItem>}\n')
          replace(path,
              '                                {workspace === "hiring" && canViewCandidatePipeline && <MenuItem onClick={() => { close(); openHiringSection("candidate-pipeline"); }}>Candidate pipeline</MenuItem>}\n                                {workspace === "hiring" && canViewAssessments && <MenuItem onClick={() => { close(); openHiringSection("assessment-list"); }}>Assessments</MenuItem>}\n                                {workspace === "hiring" && canManageOrganization && <MenuItem component={RouterLink} to="/hiring/team" onClick={close}>Team & Hiring billing</MenuItem>}\n',
              '                                {workspace === "hiring" && hasHiringOrganization && canViewCandidatePipeline && <MenuItem onClick={() => { close(); openHiringSection("candidate-pipeline"); }}>Candidate pipeline</MenuItem>}\n                                {workspace === "hiring" && hasHiringOrganization && canViewAssessments && <MenuItem onClick={() => { close(); openHiringSection("assessment-list"); }}>Assessments</MenuItem>}\n                                {workspace === "hiring" && hasHiringOrganization && canManageOrganization && <MenuItem component={RouterLink} to="/hiring/team" onClick={close}>Team & Hiring billing</MenuItem>}\n')

          # Team page: do not even fetch member/billing data for roles that cannot administer it.
          path = 'client/src/pages/HiringTeamPage.jsx'
          replace(path,
              '    const loadMembers = async () => {\n        if (!activeOrganization?._id) return;\n',
              '    const loadMembers = async () => {\n        if (!activeOrganization?._id || !canManageOrganization) return;\n')
          replace(path,
              '    useEffect(() => {\n        loadMembers();\n    }, [activeOrganization?._id]); // eslint-disable-line react-hooks/exhaustive-deps\n',
              '    useEffect(() => {\n        if (!canManageOrganization) { setMembers([]); return; }\n        loadMembers();\n    }, [activeOrganization?._id, canManageOrganization]); // eslint-disable-line react-hooks/exhaustive-deps\n')
          replace(path,
              '    useEffect(() => {\n        if (!activeOrganization?._id) return;\n        setBillingLoading(true);\n',
              '    useEffect(() => {\n        if (!activeOrganization?._id || !canManageOrganization) return;\n        setBillingLoading(true);\n')
          replace(path,
              '    if (organizationLoading) return <Container maxWidth="lg" sx={{ py: 6 }}><LinearProgress /></Container>;\n    if (activeOrganization && !canManageOrganization) return <Navigate to={hiringHomeForRole(currentRole)} replace />;\n\n    return (\n',
              '    if (organizationLoading) return <Container maxWidth="lg" sx={{ py: 6 }}><LinearProgress /></Container>;\n    if (!activeOrganization) return (\n        <Container maxWidth="sm" sx={{ py: { xs: 4, md: 8 } }}>\n            <Stack spacing={3}>\n                <Box><Typography variant="overline" color="primary.main" fontWeight={850}>Hiring setup</Typography><Typography component="h1" variant="h3" fontWeight={850}>Create your hiring organization</Typography><Typography color="text.secondary" mt={1}>Candidate assessments, team roles, shared interview credits, and Hiring billing belong to an organization—not your personal Practice account.</Typography></Box>\n                <Paper component="form" variant="outlined" sx={{ p: 3, borderRadius: 4 }} onSubmit={createAnotherOrganization}>\n                    <Stack spacing={2}><TextField autoFocus label="Organization name" value={organizationName} onChange={(event) => setOrganizationName(event.target.value)} fullWidth /><Button type="submit" variant="contained" disabled={organizationName.trim().length < 2}>Create organization</Button></Stack>\n                </Paper>\n            </Stack>\n        </Container>\n    );\n    if (!canManageOrganization) return <Navigate to={hiringHomeForRole(currentRole)} replace />;\n\n    return (\n')

          # Backend: team roster is administrative data, not reviewer/recruiter report data.
          path = 'server/src/controllers/organizationController.js'
          replace(path,
              '        const requester = await activeMembership(req.params.organizationId, req.user._id);\n        if (!requester) return res.status(404).json({ message: "Organization not found" });\n        const memberships = await OrganizationMembership.find({\n',
              '        const requester = await activeMembership(req.params.organizationId, req.user._id);\n        if (!requester) return res.status(404).json({ message: "Organization not found" });\n        if (!["owner", "admin"].includes(requester.role)) {\n            return res.status(403).json({ message: "You do not have permission to view organization members" });\n        }\n        const memberships = await OrganizationMembership.find({\n')

          # Lock the roster rule into the API journey.
          path = 'server/src/test/e2e/organizationAccess.test.js'
          replace(path,
              '        const reviewerAuth = authFor(reviewer, organizationId);\n        const reviewerList = await agent.get("/api/assessments").set(reviewerAuth).expect(200);\n',
              '        const reviewerAuth = authFor(reviewer, organizationId);\n        await agent.get(`/api/organizations/${organizationId}/members`).set(reviewerAuth).expect(403);\n        const ownerMembers = await agent.get(`/api/organizations/${organizationId}/members`).set(ownerAuth).expect(200);\n        expect(ownerMembers.body.members).toHaveLength(2);\n        const reviewerList = await agent.get("/api/assessments").set(reviewerAuth).expect(200);\n')
          PY
      - name: Commit tightened access
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/Header.jsx client/src/pages/HiringTeamPage.jsx server/src/controllers/organizationController.js server/src/test/e2e/organizationAccess.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Tighten Hiring role access and onboarding"
          git push origin HEAD:hiring-organizations
