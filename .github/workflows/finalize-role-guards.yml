name: Finalize Hiring role guards

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize role guards
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              occurrences = s.count(old)
              if occurrences != count:
                  raise SystemExit(f'{path}: expected {count}, found {occurrences}: {old[:120]!r}')
              p.write_text(s.replace(old, new))

          path = 'client/src/pages/HiringTeamPage.jsx'
          replace(path,
              '    }, [activeOrganization?._id]);\n\n    const memberCountLabel',
              '    }, [activeOrganization?._id, canManageOrganization]);\n\n    const memberCountLabel')

          path = 'client/src/pages/AssessmentsPage.jsx'
          replace(path,
              'import { Link as RouterLink, useLocation, useSearchParams } from "react-router-dom";\n',
              'import { Link as RouterLink, Navigate, useLocation, useSearchParams } from "react-router-dom";\n')
          replace(path,
              '    const { currentRole } = useContext(OrganizationContext);\n',
              '    const { currentRole, activeOrganization, loading: organizationLoading } = useContext(OrganizationContext);\n')
          replace(path,
              '    return <Container maxWidth="lg" sx={{ py: { xs: 3, md: 6 } }}>\n',
              '    if (organizationLoading) return <Stack minHeight="50vh" alignItems="center" justifyContent="center"><CircularProgress /></Stack>;\n    if (!activeOrganization) return <Navigate to="/hiring/team" replace />;\n\n    return <Container maxWidth="lg" sx={{ py: { xs: 3, md: 6 } }}>\n')
          PY
      - name: Commit final guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/HiringTeamPage.jsx client/src/pages/AssessmentsPage.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Guard Hiring routes by organization context"
          git push origin HEAD:hiring-organizations
