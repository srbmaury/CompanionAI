name: Structural cleanup

on:
  push:
    branches: [hiring-organizations]
    paths:
      - .github/workflows/structural-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply structural cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old[:160]!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          patch('client/src/pages/AssessmentsPage.jsx', [
              ('    const load = useCallback(async () => { setLoading(true); setError(""); try { const { data } = await api.get("/assessments", { params: { page, limit: 8 } }); setItems(data.items || []); setTotalPages(data.totalPages || 1); } catch { setError("We couldn’t load your assessments."); } finally { setLoading(false); } }, [page]);\n    const loadOverview = useCallback(async () => { setOverviewLoading(true); try { const { data } = await api.get("/assessments/overview", { params: { page: candidatePage, limit: 8, search: candidateSearch || undefined, status: candidateStatus || undefined, assessmentId: candidateAssessment || undefined } }); setOverview({ summary: data.summary || {}, assessments: data.assessments || [], candidates: data.candidates || [], totalPages: data.totalPages || 1 }); } catch { setError("We couldn’t load the candidate pipeline."); } finally { setOverviewLoading(false); } }, [candidatePage, candidateSearch, candidateStatus, candidateAssessment]);', '    const load = useCallback(async () => {\n        if (!activeOrganization?._id || !canViewAssessments) { setItems([]); setTotalPages(1); setLoading(false); return; }\n        setLoading(true); setError("");\n        try { const { data } = await api.get("/assessments", { params: { page, limit: 8 } }); setItems(data.items || []); setTotalPages(data.totalPages || 1); }\n        catch { setError("We couldn’t load your assessments."); }\n        finally { setLoading(false); }\n    }, [activeOrganization?._id, canViewAssessments, page]);\n    const loadOverview = useCallback(async () => {\n        if (!activeOrganization?._id || !canViewCandidatePipeline) { setOverview({ summary: {}, assessments: [], candidates: [], totalPages: 1 }); setOverviewLoading(false); return; }\n        setOverviewLoading(true);\n        try { const { data } = await api.get("/assessments/overview", { params: { page: candidatePage, limit: 8, search: candidateSearch || undefined, status: candidateStatus || undefined, assessmentId: candidateAssessment || undefined } }); setOverview({ summary: data.summary || {}, assessments: data.assessments || [], candidates: data.candidates || [], totalPages: data.totalPages || 1 }); }\n        catch { setError("We couldn’t load the candidate pipeline."); }\n        finally { setOverviewLoading(false); }\n    }, [activeOrganization?._id, canViewCandidatePipeline, candidatePage, candidateSearch, candidateStatus, candidateAssessment]);'),
              ('    useEffect(() => { load(); }, [load]);\n', '    useEffect(() => {\n        setItems([]); setPage(1); setTotalPages(1);\n        setOverview({ summary: {}, assessments: [], candidates: [], totalPages: 1 }); setCandidatePage(1); setCandidateSearch(""); setCandidateStatus(""); setCandidateAssessment("");\n        setError("");\n    }, [activeOrganization?._id]);\n    useEffect(() => { load(); }, [load]);\n'),
          ])

          patch('client/src/pages/HiringTeamPage.jsx', [
              ('import { useContext, useEffect, useMemo, useState } from "react";', 'import { useCallback, useContext, useEffect, useMemo, useState } from "react";'),
              ('    const assignableRoles = assignableHiringRolesFor(currentRole);', '    const assignableRoles = useMemo(() => assignableHiringRolesFor(currentRole), [currentRole]);'),
              ('    const loadMembers = async () => {', '    const loadMembers = useCallback(async () => {'),
              ('    };\n\n    useEffect(() => {\n        if (!canManageOrganization) { setMembers([]); return; }\n        loadMembers();\n    }, [activeOrganization?._id, canManageOrganization]); // eslint-disable-line react-hooks/exhaustive-deps', '    }, [activeOrganization?._id, canManageOrganization]);\n\n    useEffect(() => {\n        if (!canManageOrganization) { setMembers([]); return; }\n        loadMembers();\n    }, [canManageOrganization, loadMembers]);\n\n    useEffect(() => {\n        if (assignableRoles.length && !assignableRoles.includes(role)) setRole(assignableRoles[0]);\n    }, [assignableRoles, role]);'),
              ('    if (!activeOrganization) return (\n        <Container maxWidth="sm" sx={{ py: { xs: 4, md: 8 } }}>\n            <Stack spacing={3}>\n                <Box><Typography variant="overline" color="primary.main" fontWeight={850}>Hiring setup</Typography><Typography component="h1" variant="h3" fontWeight={850}>Create your hiring organization</Typography><Typography color="text.secondary" mt={1}>Candidate assessments, team roles, shared interview credits, and Hiring billing belong to an organization—not your personal Practice account.</Typography></Box>\n                <Paper component="form" variant="outlined" sx={{ p: 3, borderRadius: 4 }} onSubmit={createAnotherOrganization}>\n                    <Stack spacing={2}><TextField autoFocus label="Organization name" value={organizationName} onChange={(event) => setOrganizationName(event.target.value)} fullWidth /><Button type="submit" variant="contained" disabled={organizationName.trim().length < 2}>Create organization</Button></Stack>\n                </Paper>\n            </Stack>\n        </Container>\n    );', '    if (!activeOrganization) return null;'),
          ])

          patch('client/src/components/Header.jsx', [
