              ('    const [workspaceAnchor, setWorkspaceAnchor] = useState(null);', '    const [workspaceAnchor, setWorkspaceAnchor] = useState(null);\n    const [organizationAnchor, setOrganizationAnchor] = useState(null);'),
              ('        setWorkspaceAnchor(null);\n        setProfileAnchor(null);', '        setWorkspaceAnchor(null);\n        setOrganizationAnchor(null);\n        setProfileAnchor(null);'),
              ('    const switchWorkspace = (next) => { if (user?._id) setWorkspacePreference(next, user._id); setWorkspace(next); setWorkspaceAnchor(null); setProfileAnchor(null); navigate(next === "hiring" ? (hasHiringOrganization ? hiringHomeForRole(currentOrganizationRole) : "/hiring/team") : "/dashboard"); };', '    const switchWorkspace = (next) => { if (user?._id) setWorkspacePreference(next, user._id); setWorkspace(next); setWorkspaceAnchor(null); setOrganizationAnchor(null); setProfileAnchor(null); navigate(next === "hiring" ? (hasHiringOrganization ? hiringHomeForRole(currentOrganizationRole) : "/hiring/team") : "/dashboard"); };\n    const switchOrganization = (organization) => {\n        if (!organization?._id) return;\n        selectOrganization(organization._id);\n        setOrganizationAnchor(null);\n        close();\n        navigate(hiringHomeForRole(organization.role));\n    };'),
              ('                            </Menu>\n                        </>}', '                            </Menu>\n                            {workspace === "hiring" && hasHiringOrganization && organizations.length > 0 && <>\n                                <Button onClick={(event) => organizations.length > 1 && setOrganizationAnchor(event.currentTarget)} color="inherit" size="small" endIcon={organizations.length > 1 ? <ExpandMoreRounded /> : undefined} sx={{ display: { xs: "none", md: "inline-flex" }, maxWidth: 220, textTransform: "none" }} aria-label="Switch hiring organization"><Box component="span" sx={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{activeOrganization?.name}</Box></Button>\n                                <Menu anchorEl={organizationAnchor} open={Boolean(organizationAnchor?.isConnected)} onClose={() => setOrganizationAnchor(null)} anchorOrigin={{ vertical: "bottom", horizontal: "left" }} transformOrigin={{ vertical: "top", horizontal: "left" }}>\n                                    {organizations.map((organization) => <MenuItem key={organization._id} selected={organization._id === activeOrganization?._id} onClick={() => switchOrganization(organization)}><ListItemText primary={organization.name} secondary={organization.role?.replaceAll("_", " ")} /></MenuItem>)}\n                                </Menu>\n                            </>}\n                        </>}'),
              ('                                <MenuItem disabled sx={{ opacity: "1 !important" }}><ListItemText primary={`${workspaceLabel} workspace`} primaryTypographyProps={{ variant: "overline", fontWeight: 800, color: "primary.main" }} /></MenuItem>', '                                <MenuItem disabled sx={{ opacity: "1 !important" }}><ListItemText primary={`${workspaceLabel} workspace`} primaryTypographyProps={{ variant: "overline", fontWeight: 800, color: "primary.main" }} /></MenuItem>\n                                {workspace === "hiring" && activeOrganization && <MenuItem disabled sx={{ opacity: "1 !important" }}><ListItemText primary={activeOrganization.name} secondary={currentOrganizationRole?.replaceAll("_", " ")} /></MenuItem>}\n                                {workspace === "hiring" && organizations.length > 1 && organizations.filter((organization) => organization._id !== activeOrganization?._id).map((organization) => <MenuItem key={organization._id} onClick={() => switchOrganization(organization)}>Switch to {organization.name}</MenuItem>)}'),
          ])

          patch('server/src/controllers/authController.js', [
              ('import crypto from "crypto";\n', 'import crypto from "crypto";\nimport mongoose from "mongoose";\n'),
              ('        await Promise.all([\n            Feedback.deleteMany({ $or: [{ user: user._id }, { _id: { $in: feedbackIds } }] }),\n            Question.deleteMany({ _id: { $in: privateQuestionIds } }),\n            Round.deleteMany({ _id: { $in: roundIds } }),\n            Interview.deleteMany({ user: user._id }),\n            Resume.deleteMany({ user: user._id }),\n            ResumeReview.deleteMany({ user: user._id }),\n            SavedExperience.deleteMany({ user: user._id }),\n            ProductFeedback.deleteMany({ user: user._id }),\n            PracticeUsageCounter.deleteMany({ user: user._id }),\n            ReminderDelivery.deleteMany({ user: user._id }),\n            ProductEvent.deleteMany({ user: user._id }),\n            CandidateAttempt.deleteMany({ assessment: { $in: assessmentIds } }),\n            Assessment.deleteMany({ organization: { $in: ownedOrganizationIds } }),\n            OrganizationMembership.deleteMany({ $or: [{ user: user._id }, { organization: { $in: ownedOrganizationIds } }] }),\n            Organization.deleteMany({ _id: { $in: ownedOrganizationIds } }),\n            RefreshToken.deleteMany({ user: user._id }),\n            AuditLog.deleteMany({ user: user._id }),\n        ]);\n        await User.deleteOne({ _id: user._id });', '        const session = await mongoose.startSession();\n        try {\n            await session.withTransaction(async () => {\n                await Feedback.deleteMany({ $or: [{ user: user._id }, { _id: { $in: feedbackIds } }] }, { session });\n                await Question.deleteMany({ _id: { $in: privateQuestionIds } }, { session });\n                await Round.deleteMany({ _id: { $in: roundIds } }, { session });\n                await Interview.deleteMany({ user: user._id }, { session });\n                await Resume.deleteMany({ user: user._id }, { session });\n                await ResumeReview.deleteMany({ user: user._id }, { session });\n                await SavedExperience.deleteMany({ user: user._id }, { session });\n                await ProductFeedback.deleteMany({ user: user._id }, { session });\n                await PracticeUsageCounter.deleteMany({ user: user._id }, { session });\n                await ReminderDelivery.deleteMany({ user: user._id }, { session });\n                await ProductEvent.deleteMany({ user: user._id }, { session });\n                await CandidateAttempt.deleteMany({ assessment: { $in: assessmentIds } }, { session });\n                await Assessment.deleteMany({ organization: { $in: ownedOrganizationIds } }, { session });\n                await OrganizationMembership.deleteMany({ $or: [{ user: user._id }, { organization: { $in: ownedOrganizationIds } }] }, { session });\n                await Organization.deleteMany({ _id: { $in: ownedOrganizationIds } }, { session });\n                await RefreshToken.deleteMany({ user: user._id }, { session });\n                await AuditLog.deleteMany({ user: user._id }, { session });\n                await User.deleteOne({ _id: user._id }, { session });\n            });\n        } finally {\n            await session.endSession();\n        }'),
          ])

          patch('client/src/__tests__/hiringPermissions.test.js', [
              ('import { hiringHomeForRole, hiringPermissionsFor } from "../utils/hiringPermissions";', 'import { assignableHiringRolesFor, canManageHiringMember, hiringHomeForRole, hiringPermissionsFor } from "../utils/hiringPermissions";'),
              ('                canManageHiringBilling: true,', '                canManageHiringBilling: true,\n                canExportCandidateData: true,'),
              ('            canManageHiringBilling: false,\n        });\n    });\n\n    it("keeps hiring managers', '            canManageHiringBilling: false,\n            canExportCandidateData: true,\n        });\n    });\n\n    it("keeps hiring managers'),
              ('            canManageHiringBilling: false,\n        });\n    });\n\n    it("keeps reviewers', '            canManageHiringBilling: false,\n            canExportCandidateData: true,\n        });\n    });\n\n    it("keeps reviewers'),
              ('            canManageHiringBilling: false,\n        });\n        expect(hiringHomeForRole("reviewer"))', '            canManageHiringBilling: false,\n            canExportCandidateData: false,\n        });\n        expect(hiringHomeForRole("reviewer"))'),
              ('            canManageHiringBilling: false,\n        });\n    });\n});', '            canManageHiringBilling: false,\n            canExportCandidateData: false,\n        });\n    });\n\n    it("prevents admins from administering peer admins while owners can", () => {\n        expect(assignableHiringRolesFor("owner")).toContain("admin");\n        expect(assignableHiringRolesFor("admin")).not.toContain("admin");\n        expect(canManageHiringMember("admin", "admin")).toBe(false);\n        expect(canManageHiringMember("admin", "recruiter")).toBe(true);\n        expect(canManageHiringMember("owner", "admin")).toBe(true);\n        expect(canManageHiringMember("owner", "owner")).toBe(false);\n    });\n});'),
          ])

          patch('client/e2e/productJourneys.spec.js', [
              ('    await page.goto("/assessments");\n    await expect(page.getByRole("heading", { name: "Hiring overview" })).toBeVisible();\n    await expect(page.getByRole("button", { name: "New assessment" })).toHaveCount(0);\n\n    if ((page.viewportSize()?.width || 0) >= 900) {\n        await page.getByRole("link", { name: "Team" }).click();\n    } else {\n        await page.getByRole("button", { name: "Open navigation" }).click();\n        await page.getByRole("menuitem", { name: "Team & organization" }).click();\n    }\n    await expect(page).toHaveURL(/\\/hiring\\/team$/);\n    await expect(page.getByRole("heading", { name: "Team & organization" })).toBeVisible();\n    await expect(page.getByRole("heading", { name: "Add existing CompanionAI user" })).toHaveCount(0);', '    await page.goto("/assessments");\n    await expect(page.getByRole("heading", { name: "Candidate pipeline" })).toBeVisible();\n    await expect(page.getByRole("heading", { name: "Hiring overview" })).toHaveCount(0);\n    await expect(page.getByRole("button", { name: "New assessment" })).toHaveCount(0);\n\n    if ((page.viewportSize()?.width || 0) >= 900) {\n        await expect(page.getByRole("link", { name: "Team & billing" })).toHaveCount(0);\n    } else {\n        await page.getByRole("button", { name: "Open navigation" }).click();\n        await expect(page.getByRole("menuitem", { name: "Team & Hiring billing" })).toHaveCount(0);\n        await page.keyboard.press("Escape");\n    }\n    await page.goto("/hiring/team");\n    await expect(page).toHaveURL(/\\/assessments#candidate-pipeline$/);\n    await expect(page.getByRole("heading", { name: "Organization settings" })).toHaveCount(0);'),
          ])

          patch('README.md', [
              ('- Plan limits: Free includes 3 interviews, 3 resume reviews, and 2 assessments monthly; Pro raises those to 100/100/50; Scale raises them to 1000/1000/500 by default. Public attempt actions retain Redis-backed abuse quotas on every plan.', '- Monetization: Practice is user-owned (Free: 3 interviews + 3 resume reviews/month; Pro: 100 + 100 by default). Hiring is organization-owned and meters candidate interviews rather than assessment definitions (first organization trial: 5 lifetime credits; Starter: 25/month; Growth: 100/month by default).'),
              ('  - Stripe requires `STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`, `STRIPE_PRO_PRICE_ID`, and `STRIPE_SCALE_PRICE_ID`', '  - Stripe requires `STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`, `STRIPE_PRACTICE_PRO_PRICE_ID`, `STRIPE_HIRING_STARTER_PRICE_ID`, and `STRIPE_HIRING_GROWTH_PRICE_ID`'),
              ('- Billing: `GET /api/billing/entitlements` · `POST /api/billing/checkout-session` · `POST /api/billing/portal-session` · `POST /api/billing/webhook`', '- Billing: Practice uses `/api/billing/practice/entitlements`, `/api/billing/practice/checkout-session`, and `/api/billing/practice/portal-session`; Hiring uses the corresponding organization-scoped `/api/billing/hiring/*` endpoints; Stripe webhooks remain at `/api/billing/webhook`.'),
