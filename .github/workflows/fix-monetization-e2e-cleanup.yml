name: Fix monetization E2E cleanup

on:
  push:
    branches: [hiring-organizations]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align account deletion journey with organization ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/src/test/e2e/happyFlows.test.js')
          s = p.read_text()
          marker = '        // Self-service deletion requires confirmation and removes account-owned data.\n'
          insertion = '''        // The shared-quota check above temporarily added another organization member.\n        // Remove that test membership before exercising sole-owner account deletion.\n        await OrganizationMembership.deleteOne({ organization: hiringOrganization.body.organization._id, user: otherUser._id });\n\n'''
          if marker not in s:
              raise SystemExit('deletion marker not found')
          if insertion.strip() not in s:
              s = s.replace(marker, insertion + marker)
          old = '        expect(await Assessment.exists({ owner: me._id })).toBeNull();\n'
          new = '        expect(await Assessment.exists({ organization: hiringOrganization.body.organization._id })).toBeNull();\n'
          if old not in s:
              raise SystemExit('legacy assessment ownership assertion not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/test/e2e/happyFlows.test.js
          git commit -m "Align deletion E2E with organization ownership"
          git push origin HEAD:hiring-organizations
